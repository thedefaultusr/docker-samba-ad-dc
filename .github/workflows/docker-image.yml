name: Docker Image CI

# Images are only published from release tags (v1.2.3); commits to main are never published.
on:
  # Release: publishes 1.2.3, plus latest if it is the newest release
  push:
    tags: ["v*.*.*"]
  # Build check only, nothing is pushed
  pull_request:
    branches: ["main"]
  # Weekly rebuild of the newest release, to pick up Debian security updates
  schedule:
    - cron: "0 4 * * 1"
  # Manual rebuild: of the selected tag, or of the newest release when run on a branch
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the newest release

      # The pushed or selected tag, otherwise the newest release (pre-releases like v1.2.3-rc.1 never count as newest)
      - name: Select release
        id: release
        if: github.event_name != 'pull_request'
        run: |
          newest=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=$newest; fi
          if [ -z "$tag" ]; then
            echo "::notice::No release tag yet, nothing to publish"
          else
            git checkout --quiet "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$([ -n "$tag" ] && [ "$tag" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      # Login against a Docker registry when publishing
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.release.outputs.tag != ''
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build, and push unless this is a PR
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        if: github.event_name == 'pull_request' || steps.release.outputs.tag != ''
        uses: docker/build-push-action@v7.4.0
        with:
          context: samba-ad-dc
          pull: true
          push: ${{ steps.release.outputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
