# Read-only modules for the other DCs
uid = root
gid = root
read only = yes
hosts allow = $RSYNC_SYSVOL_ALLOW_HOSTS
hosts deny = *
auth users = $RSYNC_SYSVOL_USER
secrets file = /etc/samba/rsyncd.secret

[SysVol]
path = /var/lib/samba/sysvol/
comment = Samba Sysvol Share

# Joining DCs copy this DC's idmap.ldb, so built-in users and groups get the same IDs everywhere.
# A fresh backup is made right before each transfer.
[idmap]
path = /var/lib/samba/idmap-export/
comment = idmap.ldb backup for joining DCs
pre-xfer exec = tdbbackup -s .export /var/lib/samba/private/idmap.ldb && mv /var/lib/samba/private/idmap.ldb.export /var/lib/samba/idmap-export/idmap.ldb
